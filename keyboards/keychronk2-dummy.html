<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Keychron K2のキー配列とスイッチ情報を1画面で確認するデザインダミー">
    <title>Keychron K2 — デザインダミー</title>
    <style>
        :root {
            --canvas: #f3f1ec;
            --surface: #ffffff;
            --ink: #1d1d1f;
            --muted: #6d6b66;
            --dark: #1b1d20;
            --dark-soft: #272a2e;
            --dark-muted: #b7b9bb;
            --key: #34373b;
            --key-hover: #4a4e53;
            --accent: #ed6a2d;
            --line: #d8d4cc;
            --radius-card: 16px;
            --sans: Inter, "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
        }

        * { box-sizing: border-box; }
        html, body { height: 100%; }

        body {
            margin: 0;
            overflow: hidden;
            color: var(--ink);
            background: var(--canvas);
            font-family: var(--sans);
            line-height: 1.5;
        }

        button { font: inherit; }

        .topbar {
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            color: var(--surface);
            background: var(--dark);
        }

        .brand,
        .page-name {
            color: inherit;
            font-size: 0.84rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            text-decoration: none;
        }

        .page-name { color: var(--dark-muted); }

        .workspace {
            height: calc(100vh - 56px);
            display: grid;
            grid-template-columns: minmax(640px, 1fr) minmax(280px, 0.34fr);
            gap: 16px;
            padding: 24px;
        }

        .keyboard-panel,
        .switch-panel {
            min-height: 0;
            border-radius: var(--radius-card);
        }

        .keyboard-panel {
            display: flex;
            flex-direction: column;
            padding: 24px;
            color: var(--surface);
            background: var(--dark);
            overflow: hidden;
        }

        .panel-topline {
            display: flex;
            align-items: start;
            justify-content: space-between;
            gap: 24px;
            margin-bottom: 18px;
        }

        .panel-title,
        .switch-title {
            margin: 0;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.01em;
        }

        .panel-status {
            margin: 0;
            color: var(--dark-muted);
            font-size: 0.78rem;
            text-align: right;
        }

        .keyboard-stage {
            position: relative;
            flex: 1;
            display: grid;
            place-items: center;
            min-height: 0;
            padding: 18px;
            background: var(--dark-soft);
            overflow: hidden;
        }

        .keyboard-stage::before {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 70% 35%, rgb(237 106 45 / 7%), transparent 42%);
            content: "";
            animation: quiet-tone 18s ease-in-out infinite;
        }

        .keyboard {
            position: relative;
            z-index: 1;
            width: 100%;
            display: grid;
            gap: clamp(5px, 0.65vw, 8px);
        }

        .keyboard-row {
            display: grid;
            grid-template-columns: repeat(32, minmax(0, 1fr));
            gap: clamp(5px, 0.65vw, 8px);
        }

        .key {
            grid-column: span 2;
            min-width: 0;
            min-height: clamp(36px, 5.3vh, 50px);
            display: grid;
            place-items: center;
            padding: 4px;
            border: 1px solid transparent;
            border-radius: 7px;
            color: #f4f2ed;
            background: var(--key);
            box-shadow: 0 2px 0 rgb(0 0 0 / 22%);
            cursor: pointer;
            font-size: clamp(0.58rem, 0.75vw, 0.74rem);
            font-weight: 700;
            transition: background-color 140ms ease, border-color 140ms ease, transform 140ms ease, box-shadow 140ms ease;
            user-select: none;
        }

        .key:hover,
        .key:focus-visible {
            background: var(--key-hover);
            border-color: rgb(255 255 255 / 32%);
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .key:active,
        .key.active {
            color: #2a170e;
            background: var(--accent);
            border-color: #ffba95;
            box-shadow: 0 1px 0 rgb(0 0 0 / 24%), 0 0 0 3px rgb(237 106 45 / 18%);
            transform: translateY(2px);
        }

        .key.small { min-height: clamp(28px, 4.4vh, 40px); font-size: clamp(0.52rem, 0.66vw, 0.66rem); }
        .key.wide { grid-column: span 3; }
        .key.wider { grid-column: span 4; }
        .key.ultra-wide { grid-column: span 5; }
        .key.space { grid-column: span 11; }
        .key.device { color: var(--dark-muted); border-style: dashed; border-color: #70757a; background: transparent; }
        .key.device:hover { background: rgb(255 255 255 / 8%); }
        .function-row { margin-bottom: 8px; }

        .switch-panel {
            display: grid;
            grid-template-rows: auto minmax(180px, 0.9fr) auto;
            gap: 18px;
            padding: 24px;
            background: var(--surface);
            box-shadow: 0 18px 50px rgb(28 28 26 / 10%);
        }

        .switch-heading {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 16px;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--line);
        }

        .switch-state {
            color: var(--muted);
            font-size: 0.76rem;
        }

        .switch-image-wrap {
            min-height: 180px;
            display: grid;
            place-items: center;
            padding: 18px;
            background: #e8e4dc;
            overflow: hidden;
        }

        #switch-image {
            width: min(100%, 240px);
            height: 100%;
            min-height: 180px;
            object-fit: contain;
            transition: opacity 180ms ease, transform 180ms ease;
        }

        .switch-info {
            padding-top: 2px;
            transition: opacity 180ms ease, transform 180ms ease;
        }

        .switch-key {
            margin: 0 0 4px;
            color: var(--muted);
            font-size: 0.78rem;
        }

        .switch-name {
            margin: 0 0 18px;
            font-size: clamp(1.25rem, 2.2vw, 2rem);
            line-height: 1.1;
            letter-spacing: -0.04em;
        }

        .detail-list {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px 18px;
            margin: 0;
        }

        .detail-list div { padding-top: 9px; border-top: 1px solid var(--line); }
        .detail-list dt { color: var(--muted); font-size: 0.72rem; }
        .detail-list dd { margin: 3px 0 0; font-size: 0.9rem; font-weight: 700; }

        .notice {
            margin: 14px 0 0;
            color: var(--muted);
            font-size: 0.72rem;
            line-height: 1.55;
        }

        @keyframes quiet-tone {
            0%, 100% { opacity: 0.96; }
            50% { opacity: 1; }
        }

        @media (min-width: 1200px) {
            .topbar { padding-inline: 48px; }
            .workspace { gap: 32px; padding: 48px; }
            .keyboard-panel,
            .switch-panel { padding: 28px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <a class="brand" href="../index.html">Portfolio Lab</a>
        <span class="page-name">Keychron K2</span>
    </header>

    <main class="workspace">
        <section class="keyboard-panel" aria-labelledby="keyboard-title">
            <div class="panel-topline">
                <h1 class="panel-title" id="keyboard-title">Keychron K2のキー配列</h1>
                <p class="panel-status">選択中: <strong id="selected-key">未入力</strong></p>
            </div>
            <div class="keyboard-stage" aria-label="キーボード配列のダミー表示">
                <div class="keyboard">
                    <div class="keyboard-row function-row">
                        <button class="key small" type="button" data-key="Esc" data-switch="sw-17">Esc</button><button class="key small" type="button" data-key="F1" data-switch="sw-17">F1</button><button class="key small" type="button" data-key="F2" data-switch="sw-17">F2</button><button class="key small" type="button" data-key="F3" data-switch="sw-17">F3</button><button class="key small" type="button" data-key="F4" data-switch="sw-17">F4</button><button class="key small" type="button" data-key="F5" data-switch="sw-17">F5</button><button class="key small" type="button" data-key="F6" data-switch="sw-17">F6</button><button class="key small" type="button" data-key="F7" data-switch="sw-17">F7</button><button class="key small" type="button" data-key="F8" data-switch="sw-17">F8</button><button class="key small" type="button" data-key="F9" data-switch="sw-17">F9</button><button class="key small" type="button" data-key="F10" data-switch="sw-17">F10</button><button class="key small" type="button" data-key="F11" data-switch="sw-17">F11</button><button class="key small" type="button" data-key="F12" data-switch="sw-17">F12</button><button class="key small device" type="button" data-key="light" data-switch="sw-17">light</button>
                    </div>
                    <div class="keyboard-row">
                        <button class="key wide" type="button" data-key="A/あ" data-switch="sw-13">A/あ</button><button class="key" type="button" data-key="1" data-switch="sw-16">1</button><button class="key" type="button" data-key="2" data-switch="sw-16">2</button><button class="key" type="button" data-key="3" data-switch="sw-16">3</button><button class="key" type="button" data-key="4" data-switch="sw-16">4</button><button class="key" type="button" data-key="5" data-switch="sw-16">5</button><button class="key" type="button" data-key="6" data-switch="sw-17">6</button><button class="key" type="button" data-key="7" data-switch="sw-17">7</button><button class="key" type="button" data-key="8" data-switch="sw-17">8</button><button class="key" type="button" data-key="9" data-switch="sw-17">9</button><button class="key" type="button" data-key="0" data-switch="sw-15">0</button><button class="key" type="button" data-key="-" data-switch="sw-15">-</button><button class="key" type="button" data-key="=" data-switch="sw-15">=</button><button class="key wide" type="button" data-key="Backspace" data-switch="sw-12">Backspace</button>
                    </div>
                    <div class="keyboard-row">
                        <button class="key wider" type="button" data-key="Tab" data-switch="sw-16">Tab</button><button class="key" type="button" data-key="Q" data-switch="sw-6">Q</button><button class="key" type="button" data-key="W" data-switch="sw-8">W</button><button class="key" type="button" data-key="E" data-switch="sw-9">E</button><button class="key" type="button" data-key="R" data-switch="sw-11">R</button><button class="key" type="button" data-key="T" data-switch="sw-10">T</button><button class="key" type="button" data-key="Y" data-switch="sw-7">Y</button><button class="key" type="button" data-key="U" data-switch="sw-4">U</button><button class="key" type="button" data-key="I" data-switch="sw-3">I</button><button class="key" type="button" data-key="O" data-switch="sw-5">O</button><button class="key" type="button" data-key="P" data-switch="sw-2">P</button><button class="key" type="button" data-key="[" data-switch="sw-15">[</button><button class="key" type="button" data-key="]" data-switch="sw-15">]</button><button class="key wide" type="button" data-key="\" data-switch="sw-12">\</button>
                    </div>
                    <div class="keyboard-row">
                        <button class="key wider" type="button" data-key="Caps" data-switch="sw-17">Caps</button><button class="key" type="button" data-key="A" data-switch="sw-14">A</button><button class="key" type="button" data-key="S" data-switch="sw-8">S</button><button class="key" type="button" data-key="D" data-switch="sw-8">D</button><button class="key" type="button" data-key="F" data-switch="sw-8">F</button><button class="key" type="button" data-key="G" data-switch="sw-8">G</button><button class="key" type="button" data-key="H" data-switch="sw-8">H</button><button class="key" type="button" data-key="J" data-switch="sw-8">J</button><button class="key" type="button" data-key="K" data-switch="sw-8">K</button><button class="key" type="button" data-key="L" data-switch="sw-8">L</button><button class="key" type="button" data-key=";" data-switch="sw-15">;</button><button class="key" type="button" data-key="'" data-switch="sw-15">'</button><button class="key wide" type="button" data-key="Enter" data-switch="sw-12">Enter</button><button class="key" type="button" data-key="~" data-switch="sw-15">~</button>
                    </div>
                    <div class="keyboard-row">
                        <button class="key ultra-wide" type="button" data-key="Shift" data-switch="sw-16">Shift</button><button class="key" type="button" data-key="Z" data-switch="sw-16">Z</button><button class="key" type="button" data-key="X" data-switch="sw-13">X</button><button class="key" type="button" data-key="C" data-switch="sw-13">C</button><button class="key" type="button" data-key="V" data-switch="sw-13">V</button><button class="key" type="button" data-key="B" data-switch="sw-13">B</button><button class="key" type="button" data-key="N" data-switch="sw-13">N</button><button class="key" type="button" data-key="M" data-switch="sw-13">M</button><button class="key" type="button" data-key="," data-switch="sw-13">,</button><button class="key" type="button" data-key="." data-switch="sw-13">.</button><button class="key" type="button" data-key="/" data-switch="sw-13">/</button><button class="key wide" type="button" data-key="Shift" data-switch="sw-15">Shift</button><button class="key" type="button" data-key="↑" data-switch="sw-12">↑</button><button class="key device" type="button" data-key="esc" data-switch="sw-17">esc</button>
                    </div>
                    <div class="keyboard-row">
                        <button class="key wide" type="button" data-key="Ctrl" data-switch="sw-16">Ctrl</button><button class="key wide" type="button" data-key="Option" data-switch="sw-16">Option</button><button class="key wide" type="button" data-key="Cmd" data-switch="sw-12">Cmd</button><button class="key space" type="button" data-key="Space" data-switch="sw-12">Space</button><button class="key" type="button" data-key="Cmd" data-switch="sw-15">Cmd</button><button class="key" type="button" data-key="fn" data-switch="sw-17">fn</button><button class="key" type="button" data-key="Ctrl" data-switch="sw-17">Ctrl</button><button class="key" type="button" data-key="←" data-switch="sw-12">←</button><button class="key" type="button" data-key="↓" data-switch="sw-12">↓</button><button class="key" type="button" data-key="→" data-switch="sw-12">→</button>
                    </div>
                </div>
            </div>
        </section>

        <aside class="switch-panel" aria-labelledby="switch-title">
            <div class="switch-heading">
                <h2 class="switch-title" id="switch-title">スイッチ情報</h2>
                <span class="switch-state" id="switch-state">未入力</span>
            </div>
            <div class="switch-image-wrap">
                <img id="switch-image" src="../images/switch-placeholder.svg" alt="選択したキーに対応するスイッチ画像">
            </div>
            <div class="switch-info" id="switch-info" aria-live="polite">
                <p class="switch-key">選択中のキー: <strong id="selected-label">未入力</strong></p>
                <h3 class="switch-name" id="switch-name">未設定</h3>
                <dl class="detail-list">
                    <div><dt>割当クラス</dt><dd id="switch-class">未設定</dd></div>
                    <div><dt>種別</dt><dd id="switch-type">未設定</dd></div>
                    <div><dt>荷重</dt><dd id="switch-load">未設定</dd></div>
                    <div><dt>表示状態</dt><dd id="switch-status">未入力</dd></div>
                </dl>
                <p class="notice">キーを選択すると、対応する情報へ切り替わります。</p>
            </div>
        </aside>
    </main>

    <script>
        const keys = document.querySelectorAll(".key");
        const selectedKey = document.querySelector("#selected-key");
        const selectedLabel = document.querySelector("#selected-label");
        const switchClass = document.querySelector("#switch-class");
        const switchState = document.querySelector("#switch-state");
        const switchStatus = document.querySelector("#switch-status");
        const switchInfo = document.querySelector("#switch-info");
        const switchName = document.querySelector("#switch-name");
        const switchType = document.querySelector("#switch-type");
        const switchLoad = document.querySelector("#switch-load");
        const switchImage = document.querySelector("#switch-image");
        const placeholderImage = "../images/switch-placeholder.svg";
        let hoveredKey = null;
        let pressedKey = null;
        let selectedKeyElement = null;

        const switchCatalog = {
            "sw-02": ["Durock Full POK Mocha Silk", "Linear", "48g"],
            "sw-03": ["Gateron Oil King", "Linear", "未設定"],
            "sw-04": ["WS Pearl Switch", "Linear", "未設定"],
            "sw-05": ["80Retros X HMX Joker", "Linear", "40±10gf"],
            "sw-06": ["Gateron Mini i", "Tactile", "50±10gf"],
            "sw-07": ["TTC Frozen Silent V2", "Silent Linear", "39gf"],
            "sw-08": ["Kailh Midnight Silent V2", "Silent Linear", "40±10gf"],
            "sw-09": ["Kailh Yushakobo Fairy Silent", "Silent Linear", "35±10gf"],
            "sw-10": ["Durock Silent Linear Dolphin", "Silent Linear", "62gf"],
            "sw-11": ["Kailh Deep Sea Silent Pro Box", "Silent Linear", "45±10gf"],
            "sw-12": ["Outemu Lemon Switch V3", "Silent Tactile", "35±10gf"],
            "sw-13": ["TTC Bluish White Silent", "Silent Tactile", "42±10gf"],
            "sw-14": ["Durock T1 Shrimp", "Silent Tactile", "未設定"],
            "sw-15": ["Outemu Creamy Yellow", "Silent Tactile", "45gf"],
            "sw-16": ["Kailh Midnight Silent V2 Tactile", "Silent Tactile", "55±10gf"],
            "sw-17": ["Gateron G Pro 3.0 Red", "Linear", "45±15gf"],
        };

        const switchImageColors = {
            "sw-02": ["#b9824b", "#f4d8ad"],
            "sw-03": ["#4f7392", "#c5e2ef"],
            "sw-04": ["#6d5c9a", "#e2d8ff"],
            "sw-05": ["#a55163", "#ffd0d8"],
            "sw-06": ["#b46a44", "#ffe0c0"],
            "sw-07": ["#4c7e78", "#c3f0e7"],
            "sw-08": ["#4b648c", "#d2e2ff"],
            "sw-09": ["#6d7c9f", "#e2e8ff"],
            "sw-10": ["#826c4c", "#f4dfb9"],
            "sw-11": ["#4f5f73", "#d3e1f2"],
            "sw-12": ["#8b693d", "#f8e1b7"],
            "sw-13": ["#607c92", "#d7edf8"],
            "sw-14": ["#9f6c58", "#ffe1d2"],
            "sw-15": ["#a88745", "#fff0bd"],
            "sw-16": ["#576e9a", "#d7e2ff"],
            "sw-17": ["#a74e38", "#ffd4c4"],
        };

        function normalizeSwitchKey(value) {
            const match = value?.match(/^sw-(\d{1,2})$/i);
            return match ? `sw-${match[1].padStart(2, "0")}` : "";
        }

        function buildSwitchImage(switchKey) {
            const [bodyColor, stemColor] = switchImageColors[switchKey] || ["#6677a6", "#dce6ff"];
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><rect width="640" height="640" fill="${bodyColor}"/><g fill="none" stroke="${stemColor}" stroke-width="14" opacity="0.9"><rect x="150" y="140" width="340" height="360" rx="40"/><rect x="205" y="215" width="230" height="210" rx="24"/></g><text x="320" y="560" text-anchor="middle" font-size="34" fill="${stemColor}" font-family="Arial, sans-serif">${switchKey}</text></svg>`;
            return `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(svg)}`;
        }

        function setSwitchImage(switchKey) {
            const nextImage = switchKey ? buildSwitchImage(switchKey) : placeholderImage;
            switchImage.alt = switchKey ? `${switchKey}のスイッチ画像` : "スイッチ画像のプレースホルダー";
            if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
                switchImage.style.opacity = "1";
                switchImage.style.transform = "translateY(0)";
                switchImage.src = nextImage;
                return;
            }
            switchImage.style.opacity = "0.45";
            switchImage.style.transform = "translateY(4px)";
            switchImage.addEventListener("load", () => {
                switchImage.style.opacity = "1";
                switchImage.style.transform = "translateY(0)";
            }, { once: true });
            switchImage.src = nextImage;
            switchImage.onerror = () => {
                switchImage.onerror = null;
                switchImage.src = placeholderImage;
            };
        }

        function renderActiveKeys() {
            const displayedKey = pressedKey || hoveredKey || selectedKeyElement;
            keys.forEach((item) => item.classList.toggle("active", item === displayedKey));
        }

        function resetSelection() {
            selectedKeyElement = null;
            selectedKey.textContent = "未入力";
            selectedLabel.textContent = "未入力";
            switchClass.textContent = "未設定";
            switchName.textContent = "未設定";
            switchType.textContent = "未設定";
            switchLoad.textContent = "未設定";
            switchState.textContent = "未入力";
            switchStatus.textContent = "未入力";
            setSwitchImage("");
            renderActiveKeys();
        }

        function selectKey(key, { persist = true } = {}) {
            if (persist) selectedKeyElement = key;
            renderActiveKeys();
            const label = key.dataset.key;
            const switchKey = normalizeSwitchKey(key.dataset.switch);
            const catalog = switchCatalog[switchKey] || ["未設定", "未設定", "未設定"];
            selectedKey.textContent = label;
            selectedLabel.textContent = label;
            switchClass.textContent = switchKey || "未設定";
            switchName.textContent = catalog[0];
            switchType.textContent = catalog[1];
            switchLoad.textContent = catalog[2];
            switchState.textContent = "入力を確認";
            switchStatus.textContent = "押下中";
            setSwitchImage(switchKey);
            if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches && typeof switchInfo.animate === "function") {
                switchInfo.animate(
                    [{ opacity: 0.48, transform: "translateY(4px)" }, { opacity: 1, transform: "translateY(0)" }],
                    { duration: 180, easing: "ease-out" },
                );
            }
        }

        keys.forEach((key) => {
            key.addEventListener("click", () => selectKey(key));
            key.addEventListener("mouseenter", () => {
                hoveredKey = key;
                selectKey(key, { persist: false });
            });
            key.addEventListener("mouseleave", () => {
                hoveredKey = null;
                if (!pressedKey && !selectedKeyElement) resetSelection();
                else renderActiveKeys();
            });
        });

        window.addEventListener("keydown", (event) => {
            const key = [...keys].find((item) => item.dataset.key === event.key || item.textContent.trim().toLowerCase() === event.key.toLowerCase());
            if (key) {
                pressedKey = key;
                selectKey(key);
            }
        });

        window.addEventListener("keyup", (event) => {
            const key = [...keys].find((item) => item.dataset.key === event.key || item.textContent.trim().toLowerCase() === event.key.toLowerCase());
            if (key && pressedKey === key) {
                pressedKey = null;
                selectedKeyElement = null;
                if (hoveredKey) selectKey(hoveredKey, { persist: false });
                else resetSelection();
            }
        });

        document.querySelector(".keyboard-stage").addEventListener("mouseleave", () => {
            hoveredKey = null;
            if (!pressedKey) resetSelection();
        });
    </script>
</body>
</html>
