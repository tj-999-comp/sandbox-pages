<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Keychron K2のキー配列とスイッチ情報を確認するキーボードビジュアライザ">
    <title>Keychron K2 — キーボード入力</title>
    <style>
        :root {
            --canvas: #ffffff;
            --surface: #ffffff;
            --ink: #252827;
            --muted: #747a76;
            --dark: #1b1d20;
            --dark-muted: #b7b9bb;
            --key: #ffffff;
            --key-hover: #f3f3f0;
            --key-ink: #252827;
            --key-line: #d6d8d3;
            --accent: #d9574a;
            --stage: #fff;
            --stage-glow: rgb(0 0 0 / 3%);
            --switch-surface: #ffffff;
            --line: #e1e2dd;
            --radius-card: 16px;
            --sans: Inter, "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
        }

        * { box-sizing: border-box; }
        html, body { height: 100%; }

        body {
            margin: 0;
            overflow-x: hidden;
            overflow-y: auto;
            color: var(--ink);
            background: var(--canvas);
            font-family: var(--sans);
            line-height: 1.5;
        }

        button { font: inherit; }

        .topbar {
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            color: var(--surface);
            background: var(--dark);
        }

        .brand,
        .page-name {
            color: inherit;
            font-size: 0.84rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            text-decoration: none;
        }

        .page-name { color: var(--dark-muted); }

        .workspace {
            height: calc(100vh - 56px);
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            grid-template-rows: max-content minmax(180px, 1fr);
            gap: 16px;
            padding: 16px 24px;
            overflow: hidden;
        }

        .keyboard-panel,
        .switch-panel {
            min-height: 0;
            border-radius: 0;
        }

        .keyboard-panel {
            display: flex;
            flex-direction: column;
            min-height: 360px;
            padding: 20px;
            color: var(--ink);
            background: var(--surface);
            border: 1px solid var(--line);
            box-shadow: none;
            overflow: hidden;
        }

        .panel-topline {
            display: flex;
            align-items: start;
            justify-content: space-between;
            gap: 24px;
            margin-bottom: 18px;
        }

        .panel-title,
        .switch-title {
            margin: 0;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.01em;
        }

        .panel-status {
            margin: 0;
            color: var(--muted);
            font-size: 0.78rem;
            text-align: right;
        }

        .keyboard-stage {
            position: relative;
            flex: 0 0 auto;
            display: grid;
            align-items: start;
            justify-items: center;
            min-height: 0;
            padding: 14px 18px;
            border: 1px solid var(--line);
            background: var(--stage);
            overflow: hidden;
        }

        .keyboard-stage::before {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 70% 35%, var(--stage-glow), transparent 42%);
            content: "";
            animation: quiet-tone 18s ease-in-out infinite;
        }

        .keyboard {
            position: relative;
            z-index: 1;
            width: 100%;
            display: grid;
            gap: clamp(5px, 0.65vw, 8px);
        }

        .keyboard-row {
            display: grid;
            grid-template-columns: repeat(32, minmax(0, 1fr));
            gap: clamp(5px, 0.65vw, 8px);
        }

        .key {
            grid-column: span 2;
            min-width: 0;
            min-height: clamp(28px, 4.3vh, 44px);
            display: grid;
            place-items: center;
            padding: 4px;
            border: 1px solid var(--key-line);
            border-radius: 7px;
            color: var(--key-ink);
            background: var(--key);
            box-shadow: 0 2px 0 rgb(68 61 52 / 16%);
            cursor: pointer;
            font-size: clamp(0.58rem, 0.75vw, 0.74rem);
            font-weight: 700;
            transition: background-color 140ms ease, border-color 140ms ease, transform 140ms ease, box-shadow 140ms ease;
            user-select: none;
        }

        .key:hover,
        .key:focus-visible {
            background: var(--key-hover);
            border-color: var(--accent);
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .key:active,
        .key.active {
            color: #2b3030;
            background: var(--accent);
            border-color: #b9463d;
            box-shadow: 0 1px 0 rgb(43 48 48 / 18%), 0 0 0 3px rgb(217 87 74 / 22%);
            transform: translateY(2px);
        }

        .key.small { min-height: clamp(24px, 3.8vh, 36px); font-size: clamp(0.52rem, 0.66vw, 0.66rem); }
        .key.wide { grid-column: span 3; }
        .key.wider { grid-column: span 4; }
        .key.ultra-wide { grid-column: span 5; }
        .key.space { grid-column: span 11; }
        .key.device { color: var(--muted); border-style: dashed; border-color: var(--key-line); background: transparent; }
        .key.device:hover { background: rgb(255 255 255 / 55%); }
        .key-sub { color: var(--muted); font-size: 0.68em; font-weight: 600; }
        .function-row { margin-bottom: 8px; }

        .switch-panel {
            display: grid;
            grid-template-columns: minmax(180px, 0.28fr) minmax(0, 1fr);
            grid-template-rows: auto 1fr;
            grid-template-areas:
                "heading heading"
                "image info";
            gap: 10px 24px;
            padding: 16px 20px;
            background: var(--surface);
            border: 1px solid var(--line);
            box-shadow: none;
            overflow: hidden;
        }

        .switch-heading {
            grid-area: heading;
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 16px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--line);
        }

        .switch-state {
            color: var(--muted);
            font-size: 0.76rem;
        }

        .switch-image-wrap {
            grid-area: image;
            min-height: 0;
            height: 100%;
            display: grid;
            place-items: center;
            padding: 10px;
            border: 1px solid var(--line);
            background: var(--switch-surface);
            overflow: hidden;
        }

        #switch-image {
            width: min(100%, 156px);
            height: 100%;
            min-height: 0;
            object-fit: contain;
            transition: opacity 180ms ease, transform 180ms ease;
        }

        .switch-info {
            grid-area: info;
            align-self: center;
            padding-top: 2px;
            transition: opacity 180ms ease, transform 180ms ease;
        }

        .switch-key {
            margin: 0 0 2px;
            color: var(--muted);
            font-size: 0.78rem;
        }

        .switch-name {
            margin: 0 0 10px;
            font-size: clamp(1.15rem, 2vw, 1.7rem);
            line-height: 1.1;
            letter-spacing: -0.04em;
        }

        .detail-list {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px 18px;
            margin: 0;
        }

        .detail-list div { padding-top: 9px; border-top: 1px solid var(--line); }
        .detail-list dt { color: var(--muted); font-size: 0.72rem; }
        .detail-list dd { margin: 3px 0 0; font-size: 0.9rem; font-weight: 700; }

        .notice {
            display: none;
            margin: 8px 0 0;
            color: var(--muted);
            font-size: 0.72rem;
            line-height: 1.55;
        }

        .comparison-section {
            padding: 28px 24px 72px;
            background: var(--surface);
            border-top: 1px solid var(--line);
        }

        .comparison-heading {
            max-width: 720px;
            margin-bottom: 24px;
        }

        .comparison-heading h2,
        .comparison-heading p { margin: 0; }
        .comparison-heading h2 { font-size: clamp(1.35rem, 2vw, 1.8rem); letter-spacing: -0.03em; }
        .comparison-heading p { margin-top: 6px; color: var(--muted); font-size: 0.82rem; }

        .comparison-list {
            display: grid;
            gap: 28px;
        }

        .comparison-item {
            --variant-canvas: #ffffff;
            --variant-surface: #ffffff;
            --variant-stage: #fafaf8;
            --variant-switch: #ffffff;
            --variant-key: #ffffff;
            --variant-key-accent: #e8e8e3;
            --variant-hover: #f3f3f0;
            --variant-ink: #252827;
            --variant-muted: #747a76;
            --variant-key-line: #d6d8d3;
            --variant-accent: #252827;
            --variant-line: #e1e2dd;
            color: var(--variant-ink);
            background: #ffffff;
            border: 1px solid var(--variant-line);
            border-radius: 0;
            overflow: hidden;
        }

        .comparison-item[data-design] {
            border-top: 2px solid var(--variant-accent);
        }

        .comparison-item__heading {
            display: flex;
            align-items: baseline;
            gap: 12px;
            padding: 16px 20px 12px;
            border-bottom: 1px solid var(--variant-line);
        }

        .comparison-item__index {
            color: var(--variant-accent);
            font-size: 0.74rem;
            font-weight: 800;
        }

        .comparison-item__heading h3,
        .comparison-item__heading p { margin: 0; }
        .comparison-item__heading h3 { font-size: 1rem; }
        .comparison-item__heading p { margin-left: auto; color: var(--variant-muted); font-size: 0.76rem; }

        .comparison-item__workspace {
            display: grid;
            gap: 12px;
            padding: 16px 20px 20px;
        }

        .comparison-keyboard-panel,
        .comparison-switch-panel {
            min-width: 0;
            background: var(--variant-surface);
            border: 1px solid var(--variant-line);
            border-radius: 0;
        }

        .comparison-keyboard-panel {
            padding: 14px;
        }

        .comparison-panel-topline {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 12px;
            margin: 0 2px 10px;
        }

        .comparison-panel-topline h4,
        .comparison-panel-topline span { margin: 0; }
        .comparison-panel-topline h4 { font-size: 0.82rem; }
        .comparison-panel-topline span { color: var(--variant-muted); font-size: 0.68rem; }

        .comparison-keyboard-panel .keyboard-stage {
            --stage: var(--variant-stage);
            --stage-glow: rgb(0 0 0 / 3%);
            --key: var(--variant-key);
            --key-hover: var(--variant-hover);
            --key-ink: var(--variant-ink);
            --key-line: var(--variant-key-line);
            --accent: var(--variant-accent);
            --line: var(--variant-line);
            --muted: var(--variant-muted);
        }

        .comparison-keyboard-panel .keyboard-stage::before { animation: none; }
        .comparison-keyboard-panel .keyboard { gap: 5px; }
        .comparison-keyboard-panel .keyboard-row { gap: 5px; }
        .comparison-keyboard-panel .key { min-height: 26px; font-size: 0.58rem; }
        .comparison-keyboard-panel .key.small { min-height: 22px; font-size: 0.5rem; }
        .comparison-keyboard-panel .key.variant-accent-key {
            background: var(--variant-key-accent);
            border-color: var(--variant-accent);
        }
        .comparison-keyboard-panel .key.variant-accent-strong {
            color: #ffffff;
            background: var(--variant-accent);
            border-color: var(--variant-accent);
        }

        .comparison-switch-panel {
            display: grid;
            grid-template-columns: minmax(120px, 0.24fr) minmax(0, 1fr);
            grid-template-rows: auto 1fr;
            grid-template-areas:
                "heading heading"
                "image info";
            gap: 10px 16px;
            padding: 14px;
        }

        .comparison-switch-heading {
            grid-area: heading;
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--variant-line);
        }

        .comparison-switch-heading h4,
        .comparison-switch-heading span { margin: 0; }
        .comparison-switch-heading h4 { font-size: 0.82rem; }
        .comparison-switch-heading span { color: var(--variant-muted); font-size: 0.68rem; }

        .comparison-switch-visual {
            grid-area: image;
            display: grid;
            place-items: center;
            min-height: 96px;
            background: var(--variant-switch);
            border: 1px solid var(--variant-line);
        }

        .comparison-switch-image { width: min(100%, 92px); height: 92px; object-fit: contain; }

        .comparison-switch-info { grid-area: info; align-self: center; min-width: 0; }
        .comparison-switch-info p,
        .comparison-switch-info h4 { margin: 0; }
        .comparison-switch-info p { color: var(--variant-muted); font-size: 0.74rem; }
        .comparison-switch-info h4 { margin-top: 3px; font-size: 1.08rem; }

        .comparison-detail-list {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 8px 12px;
            margin: 10px 0 0;
        }

        .comparison-detail-list div { padding-top: 6px; border-top: 1px solid var(--variant-line); }
        .comparison-detail-list dt { color: var(--variant-muted); font-size: 0.64rem; }
        .comparison-detail-list dd { margin: 2px 0 0; font-size: 0.76rem; font-weight: 700; }

        @media (max-width: 1199px) {
            .switch-panel { padding: 12px 16px; gap: 8px 16px; }
            .switch-name { margin-bottom: 6px; font-size: 1.15rem; }
            .detail-list { gap: 6px 12px; }
            .detail-list div { padding-top: 6px; }
            .detail-list dd { margin-top: 2px; font-size: 0.82rem; }
        }

        @keyframes quiet-tone {
            0%, 100% { opacity: 0.96; }
            50% { opacity: 1; }
        }

        @media (min-width: 1200px) {
            .topbar { padding-inline: 48px; }
            .workspace { grid-template-rows: max-content minmax(200px, 1fr); gap: 32px; padding: 24px 48px; }
            .keyboard-panel { padding: 24px; }
            .switch-panel { padding: 18px 24px; }
            .detail-list { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px 12px; }
            .comparison-section { padding-inline: 48px; }
            .comparison-item__workspace { padding-inline: 24px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <a class="brand" href="../index.html">Portfolio Lab</a>
        <span class="page-name">Keychron K2</span>
    </header>

    <main class="workspace">
        <section class="keyboard-panel" aria-labelledby="keyboard-title">
            <div class="panel-topline">
                <h1 class="panel-title" id="keyboard-title">Keychron K2のキー配列</h1>
                <p class="panel-status">選択中: <strong id="selected-key">未入力</strong></p>
            </div>
            <div class="keyboard-stage" aria-label="キーボード配列の表示">
                <div class="keyboard">
                    <div class="keyboard-row function-row">
                        <button class="key small" type="button" data-key="Esc" data-code="Escape" data-switch="sw-17">Esc</button><button class="key small" type="button" data-key="F1" data-switch="sw-17">F1</button><button class="key small" type="button" data-key="F2" data-switch="sw-17">F2</button><button class="key small" type="button" data-key="F3" data-switch="sw-17">F3</button><button class="key small" type="button" data-key="F4" data-switch="sw-17">F4</button><button class="key small" type="button" data-key="F5" data-switch="sw-17">F5</button><button class="key small" type="button" data-key="F6" data-switch="sw-17">F6</button><button class="key small" type="button" data-key="F7" data-switch="sw-17">F7</button><button class="key small" type="button" data-key="F8" data-switch="sw-17">F8</button><button class="key small" type="button" data-key="F9" data-switch="sw-17">F9</button><button class="key small" type="button" data-key="F10" data-switch="sw-17">F10</button><button class="key small" type="button" data-key="F11" data-switch="sw-17">F11</button><button class="key small" type="button" data-key="F12" data-switch="sw-17">F12</button><button class="key small device" type="button" data-key="?" data-switch="sw-17"><span class="key-main">?</span><span class="key-sub">mod</span></button><button class="key small" type="button" data-key="Del" data-code="Delete" data-switch="sw-17">Del</button><button class="key small device" type="button" data-key="light" data-switch="sw-17"><span class="key-main">light</span><span class="key-sub">device</span></button>
                    </div>
                    <div class="keyboard-row">
                        <button class="key" type="button" data-key="" data-switch="sw-13">A/あ</button><button class="key" type="button" data-key="Digit1" data-switch="sw-16">1</button><button class="key" type="button" data-key="Digit2" data-switch="sw-16">2</button><button class="key" type="button" data-key="Digit3" data-switch="sw-16">3</button><button class="key" type="button" data-key="Digit4" data-switch="sw-16">4</button><button class="key" type="button" data-key="Digit5" data-switch="sw-16">5</button><button class="key" type="button" data-key="Digit6" data-switch="sw-17">6</button><button class="key" type="button" data-key="Digit7" data-switch="sw-17">7</button><button class="key" type="button" data-key="Digit8" data-switch="sw-17">8</button><button class="key" type="button" data-key="Digit9" data-switch="sw-17">9</button><button class="key" type="button" data-key="Digit0" data-switch="sw-15">0</button><button class="key" type="button" data-key="Minus" data-switch="sw-15">-</button><button class="key" type="button" data-key="Equal" data-switch="sw-15">=</button><button class="key wider" type="button" data-key="Backspace" data-switch="sw-12">Backspace</button><button class="key small" type="button" data-key="PgUp" data-code="PageUp" data-combo="Meta+KeyC" data-switch="sw-17"><span class="key-main">PgUp</span><span class="key-sub">Cmd+C</span></button>
                    </div>
                    <div class="keyboard-row">
                        <button class="key wide" type="button" data-key="Tab" data-switch="sw-16">Tab</button><button class="key" type="button" data-key="KeyQ" data-switch="sw-6">Q</button><button class="key" type="button" data-key="KeyW" data-switch="sw-8">W</button><button class="key" type="button" data-key="KeyE" data-switch="sw-9">E</button><button class="key" type="button" data-key="KeyR" data-switch="sw-11">R</button><button class="key" type="button" data-key="KeyT" data-switch="sw-10">T</button><button class="key" type="button" data-key="KeyY" data-switch="sw-7">Y</button><button class="key" type="button" data-key="KeyU" data-switch="sw-4">U</button><button class="key" type="button" data-key="KeyI" data-switch="sw-3">I</button><button class="key" type="button" data-key="KeyO" data-switch="sw-5">O</button><button class="key" type="button" data-key="KeyP" data-switch="sw-2">P</button><button class="key" type="button" data-key="BracketLeft" data-switch="sw-15">[</button><button class="key" type="button" data-key="BracketRight" data-switch="sw-15">]</button><button class="key wide" type="button" data-key="Backslash" data-switch="sw-12">&#92;&#92;</button><button class="key small" type="button" data-key="PgDn" data-code="PageDown" data-combo="Meta+KeyV" data-switch="sw-17"><span class="key-main">PgDn</span><span class="key-sub">Cmd+V</span></button>
                    </div>
                    <div class="keyboard-row">
                        <button class="key wider" type="button" data-key="CapsLock">Caps</button><button class="key" type="button" data-key="KeyA" data-switch="sw-14">A</button><button class="key" type="button" data-key="KeyS" data-switch="sw-8">S</button><button class="key" type="button" data-key="KeyD" data-switch="sw-8">D</button><button class="key" type="button" data-key="KeyF" data-switch="sw-8">F</button><button class="key" type="button" data-key="KeyG" data-switch="sw-8">G</button><button class="key" type="button" data-key="KeyH" data-switch="sw-8">H</button><button class="key" type="button" data-key="KeyJ" data-switch="sw-8">J</button><button class="key" type="button" data-key="KeyK" data-switch="sw-8">K</button><button class="key" type="button" data-key="KeyL" data-switch="sw-8">L</button><button class="key" type="button" data-key="Semicolon" data-switch="sw-15">;</button><button class="key" type="button" data-key="Quote" data-switch="sw-15">'</button><button class="key wider" type="button" data-key="Enter" data-switch="sw-12">Enter</button><button class="key" type="button" data-key="Backquote" data-switch="sw-15">~</button>
                    </div>
                    <div class="keyboard-row">
                        <button class="key ultra-wide" type="button" data-key="ShiftLeft" data-switch="sw-16">Shift</button><button class="key" type="button" data-key="KeyZ" data-switch="sw-16">Z</button><button class="key" type="button" data-key="KeyX" data-switch="sw-13">X</button><button class="key" type="button" data-key="KeyC" data-switch="sw-13">C</button><button class="key" type="button" data-key="KeyV" data-switch="sw-13">V</button><button class="key" type="button" data-key="KeyB" data-switch="sw-13">B</button><button class="key" type="button" data-key="KeyN" data-switch="sw-13">N</button><button class="key" type="button" data-key="KeyM" data-switch="sw-13">M</button><button class="key" type="button" data-key="Comma" data-switch="sw-13">,</button><button class="key" type="button" data-key="Period" data-switch="sw-13">.</button><button class="key" type="button" data-key="Slash" data-switch="sw-13">/</button><button class="key wide" type="button" data-key="ShiftRight" data-switch="sw-15">Shift</button><button class="key" type="button" data-key="↑" data-code="ArrowUp" data-switch="sw-12">↑</button><button class="key device" type="button" data-key="esc" data-switch="sw-12"><span class="key-main">esc</span></button>
                    </div>
                    <div class="keyboard-row">
                        <button class="key wide" type="button" data-key="Ctrl" data-code="ControlLeft" data-switch="sw-16">Ctrl</button><button class="key wide" type="button" data-key="Option" data-code="AltLeft" data-switch="sw-16">Option</button><button class="key wide" type="button" data-key="Cmd" data-code="MetaLeft" data-switch="sw-12">Cmd</button><button class="key space" type="button" data-key="Space" data-code="Space" data-switch="sw-12">Space</button><button class="key" type="button" data-key="Cmd" data-code="MetaRight" data-switch="sw-15">Cmd</button><button class="key" type="button" data-key="fn" data-switch="sw-17">fn</button><button class="key" type="button" data-key="Ctrl" data-code="ControlRight" data-switch="sw-17">Ctrl</button><button class="key" type="button" data-key="←" data-code="ArrowLeft" data-switch="sw-12">←</button><button class="key" type="button" data-key="↓" data-code="ArrowDown" data-switch="sw-12">↓</button><button class="key" type="button" data-key="→" data-code="ArrowRight" data-switch="sw-12">→</button>
                    </div>
                </div>
            </div>
        </section>

        <aside class="switch-panel" aria-labelledby="switch-title">
            <div class="switch-heading">
                <h2 class="switch-title" id="switch-title">スイッチ情報</h2>
                <span class="switch-state" id="switch-state">未入力</span>
            </div>
            <div class="switch-image-wrap">
                <img id="switch-image" src="../images/switch-placeholder.svg" alt="選択したキーに対応するスイッチ画像">
            </div>
            <div class="switch-info" id="switch-info" aria-live="polite">
                <p class="switch-key">選択中のキー: <strong id="selected-label">未入力</strong></p>
                <h3 class="switch-name" id="switch-name">未設定</h3>
                <dl class="detail-list">
                    <div><dt>割当クラス</dt><dd id="switch-class">未設定</dd></div>
                    <div><dt>種別</dt><dd id="switch-type">未設定</dd></div>
                    <div><dt>荷重</dt><dd id="switch-load">未設定</dd></div>
                    <div><dt>表示状態</dt><dd id="switch-status">未入力</dd></div>
                </dl>
                <p class="notice">キーを選択すると、対応する情報へ切り替わります。</p>
            </div>
        </aside>
    </main>

    <section class="comparison-section" aria-labelledby="comparison-title">
        <div class="comparison-heading">
            <h2 id="comparison-title">デザイン案</h2>
            <p>白基調と共通の構成を保ったまま、アクセント色だけを変えた検討案です。</p>
        </div>
        <div class="comparison-list" id="comparison-list"></div>
    </section>

    <script>
        const keys = document.querySelectorAll(".key");
        const selectedKey = document.querySelector("#selected-key");
        const selectedLabel = document.querySelector("#selected-label");
        const switchClass = document.querySelector("#switch-class");
        const switchState = document.querySelector("#switch-state");
        const switchStatus = document.querySelector("#switch-status");
        const switchInfo = document.querySelector("#switch-info");
        const switchName = document.querySelector("#switch-name");
        const switchType = document.querySelector("#switch-type");
        const switchLoad = document.querySelector("#switch-load");
        const switchImage = document.querySelector("#switch-image");
        const placeholderImage = "../images/switch-placeholder.svg";
        let hoveredKey = null;
        let pressedKey = null;
        let selectedKeyElement = null;

        const designVariants = [
            { id: "01", name: "Sage / Graphite", note: "淡い緑を少数キーへ", canvas: "#ffffff", surface: "#ffffff", stage: "#fafaf8", switchSurface: "#ffffff", key: "#ffffff", keyAccent: "#c9dcd6", hover: "#f1f6f4", ink: "#252827", muted: "#747a76", keyLine: "#d6d8d3", accent: "#5d7f75", line: "#e1e2dd" },
            { id: "02", name: "Cobalt / Paper", note: "青を線とキーへ", canvas: "#ffffff", surface: "#ffffff", stage: "#fafaf8", switchSurface: "#ffffff", key: "#ffffff", keyAccent: "#c8d9ed", hover: "#eef3f9", ink: "#252827", muted: "#747a76", keyLine: "#d6d8d3", accent: "#3f72b5", line: "#e1e2dd" },
            { id: "03", name: "Sunflower / Ink", note: "黄色を点在させる", canvas: "#ffffff", surface: "#ffffff", stage: "#fafaf8", switchSurface: "#ffffff", key: "#ffffff", keyAccent: "#eadb9f", hover: "#faf6e7", ink: "#252827", muted: "#747a76", keyLine: "#d6d8d3", accent: "#b38a2f", line: "#e1e2dd" },
            { id: "04", name: "Vermilion / Lilac", note: "04の朱色を主役に", canvas: "#ffffff", surface: "#ffffff", stage: "#fafaf8", switchSurface: "#ffffff", key: "#ffffff", keyAccent: "#e7c5d3", hover: "#f8eeee", ink: "#252827", muted: "#747a76", keyLine: "#d6d8d3", accent: "#d9574a", line: "#e1e2dd" },
            { id: "05", name: "Ultramarine / Paper", note: "青を静かに置く", canvas: "#ffffff", surface: "#ffffff", stage: "#fafaf8", switchSurface: "#ffffff", key: "#ffffff", keyAccent: "#cdd5ee", hover: "#f0f3fb", ink: "#252827", muted: "#747a76", keyLine: "#d6d8d3", accent: "#3157a6", line: "#e1e2dd" },
        ];

        const switchCatalog = {
            "sw-02": ["Durock Full POK Mocha Silk", "Linear", "48g"],
            "sw-03": ["Gateron Oil King", "Linear", "未設定"],
            "sw-04": ["WS Pearl Switch", "Linear", "未設定"],
            "sw-05": ["80Retros X HMX Joker", "Linear", "40±10gf"],
            "sw-06": ["Gateron Mini i", "Tactile", "50±10gf"],
            "sw-07": ["TTC Frozen Silent V2", "Silent Linear", "39gf"],
            "sw-08": ["Kailh Midnight Silent V2", "Silent Linear", "40±10gf"],
            "sw-09": ["Kailh Yushakobo Fairy Silent", "Silent Linear", "35±10gf"],
            "sw-10": ["Durock Silent Linear Dolphin", "Silent Linear", "62gf"],
            "sw-11": ["Kailh Deep Sea Silent Pro Box", "Silent Linear", "45±10gf"],
            "sw-12": ["Outemu Lemon Switch V3", "Silent Tactile", "35±10gf"],
            "sw-13": ["TTC Bluish White Silent", "Silent Tactile", "42±10gf"],
            "sw-14": ["Durock T1 Shrimp", "Silent Tactile", "未設定"],
            "sw-15": ["Outemu Creamy Yellow", "Silent Tactile", "45gf"],
            "sw-16": ["Kailh Midnight Silent V2 Tactile", "Silent Tactile", "55±10gf"],
            "sw-17": ["Gateron G Pro 3.0 Red", "Linear", "45±15gf"],
        };

        const switchImageColors = {
            "sw-02": ["#b9824b", "#f4d8ad"],
            "sw-03": ["#4f7392", "#c5e2ef"],
            "sw-04": ["#6d5c9a", "#e2d8ff"],
            "sw-05": ["#a55163", "#ffd0d8"],
            "sw-06": ["#b46a44", "#ffe0c0"],
            "sw-07": ["#4c7e78", "#c3f0e7"],
            "sw-08": ["#4b648c", "#d2e2ff"],
            "sw-09": ["#6d7c9f", "#e2e8ff"],
            "sw-10": ["#826c4c", "#f4dfb9"],
            "sw-11": ["#4f5f73", "#d3e1f2"],
            "sw-12": ["#8b693d", "#f8e1b7"],
            "sw-13": ["#607c92", "#d7edf8"],
            "sw-14": ["#9f6c58", "#ffe1d2"],
            "sw-15": ["#a88745", "#fff0bd"],
            "sw-16": ["#576e9a", "#d7e2ff"],
            "sw-17": ["#a74e38", "#ffd4c4"],
        };

        function buildDesignSwitchImage(design) {
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240"><rect width="240" height="240" fill="${design.switchSurface}"/><rect x="58" y="34" width="124" height="172" rx="26" fill="${design.keyAccent}" stroke="${design.accent}" stroke-width="14"/><rect x="84" y="70" width="72" height="92" rx="12" fill="none" stroke="${design.accent}" stroke-width="8"/></svg>`;
            return `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(svg)}`;
        }

        function renderDesignComparisons() {
            const comparisonList = document.querySelector("#comparison-list");
            const keyboardMarkup = document.querySelector(".keyboard").innerHTML;
            comparisonList.innerHTML = designVariants.map((design) => `
                <article class="comparison-item" data-design="${design.id}" aria-label="${design.id} ${design.name}のデザイン案" style="--variant-canvas:${design.canvas};--variant-surface:${design.surface};--variant-stage:${design.stage};--variant-switch:${design.switchSurface};--variant-key:${design.key};--variant-key-accent:${design.keyAccent};--variant-hover:${design.hover};--variant-ink:${design.ink};--variant-muted:${design.muted};--variant-key-line:${design.keyLine};--variant-accent:${design.accent};--variant-line:${design.line};">
                    <div class="comparison-item__heading">
                        <span class="comparison-item__index">${design.id}</span>
                        <h3>${design.name}</h3>
                        <p>${design.note}</p>
                    </div>
                    <div class="comparison-item__workspace">
                        <section class="comparison-keyboard-panel" aria-label="${design.name}のキーボード配列">
                            <div class="comparison-panel-topline"><h4>Keychron K2のキー配列</h4><span>白基調・構成は同じ</span></div>
                            <div class="keyboard-stage" aria-hidden="true" inert><div class="keyboard">${keyboardMarkup}</div></div>
                        </section>
                        <aside class="comparison-switch-panel" aria-label="${design.name}のスイッチ情報">
                            <div class="comparison-switch-heading"><h4>スイッチ情報</h4><span>未入力</span></div>
                            <div class="comparison-switch-visual"><img class="comparison-switch-image" src="${buildDesignSwitchImage(design)}" alt="${design.name}のスイッチ画像"></div>
                            <div class="comparison-switch-info">
                                <p>選択中のキー: <strong>未入力</strong></p>
                                <h4>未設定</h4>
                                <dl class="comparison-detail-list">
                                    <div><dt>割当クラス</dt><dd>未設定</dd></div>
                                    <div><dt>種別</dt><dd>Linear</dd></div>
                                    <div><dt>荷重</dt><dd>未設定</dd></div>
                                    <div><dt>表示状態</dt><dd>未入力</dd></div>
                                </dl>
                            </div>
                        </aside>
                    </div>
                </article>
            `).join("");

            comparisonList.querySelectorAll("button").forEach((button) => {
                button.tabIndex = -1;
                button.setAttribute("aria-hidden", "true");
            });

            comparisonList.querySelectorAll(".comparison-item").forEach((item) => {
                const accentKeys = [
                    ".keyboard-row:nth-child(2) .key:nth-child(1)",
                    ".keyboard-row:nth-child(3) .key:nth-child(4)",
                    ".keyboard-row:nth-child(4) .key:nth-child(8)",
                    ".keyboard-row:nth-child(5) .key:nth-child(4)",
                    ".keyboard-row:nth-child(6) .key:nth-child(7)",
                ].flatMap((selector) => [...item.querySelectorAll(selector)]);
                accentKeys.forEach((key, index) => key.classList.add(index === 2 ? "variant-accent-strong" : "variant-accent-key"));
            });
        }

        renderDesignComparisons();

        function normalizeSwitchKey(value) {
            const match = value?.match(/^sw-(\d{1,2})$/i);
            return match ? `sw-${match[1].padStart(2, "0")}` : "";
        }

        function buildSwitchImage(switchKey) {
            const [bodyColor, stemColor] = switchImageColors[switchKey] || ["#6677a6", "#dce6ff"];
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><rect width="640" height="640" fill="${bodyColor}"/><g fill="none" stroke="${stemColor}" stroke-width="14" opacity="0.9"><rect x="150" y="140" width="340" height="360" rx="40"/><rect x="205" y="215" width="230" height="210" rx="24"/></g><text x="320" y="560" text-anchor="middle" font-size="34" fill="${stemColor}" font-family="Arial, sans-serif">${switchKey}</text></svg>`;
            return `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(svg)}`;
        }

        function setSwitchImage(switchKey) {
            const nextImage = switchKey ? buildSwitchImage(switchKey) : placeholderImage;
            switchImage.alt = switchKey ? `${switchKey}のスイッチ画像` : "スイッチ画像のプレースホルダー";
            if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
                switchImage.style.opacity = "1";
                switchImage.style.transform = "translateY(0)";
                switchImage.src = nextImage;
                return;
            }
            switchImage.style.opacity = "0.45";
            switchImage.style.transform = "translateY(4px)";
            switchImage.addEventListener("load", () => {
                switchImage.style.opacity = "1";
                switchImage.style.transform = "translateY(0)";
            }, { once: true });
            switchImage.src = nextImage;
            switchImage.onerror = () => {
                switchImage.onerror = null;
                switchImage.src = placeholderImage;
            };
        }

        function renderActiveKeys() {
            const displayedKey = pressedKey || hoveredKey || selectedKeyElement;
            keys.forEach((item) => item.classList.toggle("active", item === displayedKey));
        }

        function resetSelection() {
            selectedKeyElement = null;
            selectedKey.textContent = "未入力";
            selectedLabel.textContent = "未入力";
            switchClass.textContent = "未設定";
            switchName.textContent = "未設定";
            switchType.textContent = "未設定";
            switchLoad.textContent = "未設定";
            switchState.textContent = "未入力";
            switchStatus.textContent = "未入力";
            setSwitchImage("");
            renderActiveKeys();
        }

        function selectKey(key, { persist = true } = {}) {
            if (persist) selectedKeyElement = key;
            renderActiveKeys();
            const label = key.querySelector(".key-main")?.textContent.trim() || key.textContent.trim();
            const switchKey = normalizeSwitchKey(key.dataset.switch);
            const catalog = switchCatalog[switchKey] || ["未設定", "未設定", "未設定"];
            selectedKey.textContent = label;
            selectedLabel.textContent = label;
            switchClass.textContent = switchKey || "未設定";
            switchName.textContent = catalog[0];
            switchType.textContent = catalog[1];
            switchLoad.textContent = catalog[2];
            switchState.textContent = "入力を確認";
            switchStatus.textContent = "押下中";
            setSwitchImage(switchKey);
            if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches && typeof switchInfo.animate === "function") {
                switchInfo.animate(
                    [{ opacity: 0.48, transform: "translateY(4px)" }, { opacity: 1, transform: "translateY(0)" }],
                    { duration: 180, easing: "ease-out" },
                );
            }
        }

        keys.forEach((key) => {
            key.addEventListener("click", () => selectKey(key));
            key.addEventListener("mouseenter", () => {
                hoveredKey = key;
                selectKey(key, { persist: false });
            });
            key.addEventListener("mouseleave", () => {
                hoveredKey = null;
                if (!pressedKey && !selectedKeyElement) resetSelection();
                else renderActiveKeys();
            });
        });

        window.addEventListener("keydown", (event) => {
            const key = [...keys].find((item) => item.dataset.key === event.code || item.dataset.code === event.code || item.dataset.key === event.key || item.textContent.trim().toLowerCase() === event.key.toLowerCase());
            if (key) {
                pressedKey = key;
                selectKey(key);
            }
        });

        window.addEventListener("keyup", (event) => {
            const key = [...keys].find((item) => item.dataset.key === event.code || item.dataset.code === event.code || item.dataset.key === event.key || item.textContent.trim().toLowerCase() === event.key.toLowerCase());
            if (key && pressedKey === key) {
                pressedKey = null;
                selectedKeyElement = null;
                if (hoveredKey) selectKey(hoveredKey, { persist: false });
                else resetSelection();
            }
        });

        document.querySelector(".keyboard-stage").addEventListener("mouseleave", () => {
            hoveredKey = null;
            if (!pressedKey) resetSelection();
        });
    </script>
</body>
</html>
