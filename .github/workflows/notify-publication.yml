name: Retry publication notification

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: Published project identifier
        required: true
        type: string
      target_basenames:
        description: Published work-record basename or comma-separated basenames
        required: true
        type: string
      publication_id:
        description: Existing create/update publication_id from provenance
        required: true
        type: string
      commit_sha:
        description: Apply commit SHA containing the provenance manifest
        required: true
        type: string

permissions: {}

jobs:
  notify:
    name: Retry Slack notification only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout fixed apply commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify fixed commit and inputs
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          [[ "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$COMMIT_SHA"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Resolve existing create/update publication
        env:
          PROJECT_ID: ${{ inputs.project_id }}
          TARGET_BASENAMES: ${{ inputs.target_basenames }}
          PUBLICATION_ID: ${{ inputs.publication_id }}
          SITE_URL: https://tj-999-comp.github.io/sandbox-pages
        run: |
          set -euo pipefail
          manifest="provenance/$PROJECT_ID/$PUBLICATION_ID.json"
          test -f "$manifest"
          jq -e \
            --arg project_id "$PROJECT_ID" \
            --arg publication_id "$PUBLICATION_ID" \
            '(
              .project_id == $project_id and
              .publication_id == $publication_id and
              (.operation == "create" or .operation == "update") and
              .notify == true
            )' \
            "$manifest" >/dev/null
          IFS=',' read -r -a basenames <<< "$TARGET_BASENAMES"
          test "${#basenames[@]}" -gt 0
          : > "$RUNNER_TEMP/notification-records.tsv"
          for raw_basename in "${basenames[@]}"; do
            basename="$(printf '%s' "$raw_basename" | sed -e 's/^ *//' -e 's/ *$//')"
            test -n "$basename"
            record="$(jq -cer --arg basename "$basename" '
              [.records[] | select(.basename == $basename)]
              | if length == 1 then .[0] else error("target record must be unique") end
            ' "$manifest")"
            title="$(jq -er '.metadata.title | select(type == "string" and length > 0)' <<<"$record")"
            record_path="$(jq -er '.public_url | select(type == "string" and length > 0)' <<<"$record")"
            public_url="$(python3 -m scripts.publish.slack_notification resolve-url \
              --site-url "$SITE_URL" \
              --record-path "$record_path")"
            printf '%s\t%s\t%s\n' "$basename" "$title" "$public_url" >> "$RUNNER_TEMP/notification-records.tsv"
          done

      - name: Verify existing public URLs
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r _basename _title public_url; do
            python3 -m scripts.publish.slack_notification verify-url \
              --url "$public_url" \
              --attempts 5 \
              --delay-seconds 10
          done < "$RUNNER_TEMP/notification-records.tsv"

      - name: Send Slack notifications only
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          PROJECT_ID: ${{ inputs.project_id }}
          PUBLICATION_ID: ${{ inputs.publication_id }}
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r basename title public_url; do
            python3 -m scripts.publish.slack_notification send \
              --webhook-env SLACK_WEBHOOK_URL \
              --project-id "$PROJECT_ID" \
              --target-basename "$basename" \
              --title "$title" \
              --publication-id "$PUBLICATION_ID" \
              --public-url "$public_url"
          done < "$RUNNER_TEMP/notification-records.tsv"
