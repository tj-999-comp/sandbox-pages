name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact main commit SHA to deploy
        required: true
        type: string
  workflow_call:
    inputs:
      commit_sha:
        description: Exact main commit SHA to deploy
        required: true
        type: string
      should_deploy:
        description: Whether the caller has a new publication to deploy
        required: false
        default: true
        type: boolean
    outputs:
      page_url:
        description: Deployed GitHub Pages URL
        value: ${{ jobs.deploy.outputs.page_url }}

permissions: {}

concurrency:
  group: pages-production-main
  cancel-in-progress: false

jobs:
  noop:
    name: Complete no-op without deploying
    if: ${{ github.event_name == 'workflow_call' && !inputs.should_deploy }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Confirm no-op publication
        run: echo "No new publication; skipping Pages deploy"

  build:
    name: Build fixed SHA artifact
    if: github.event_name != 'workflow_call' || inputs.should_deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      target_sha: ${{ steps.target.outputs.target_sha }}
    steps:
      - name: Checkout fixed commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.commit_sha || github.sha }}
          fetch-depth: 1
      - name: Verify fixed commit is current main
        id: target
        env:
          TARGET_SHA: ${{ inputs.commit_sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "commit_sha must be a full lowercase SHA" >&2
            exit 1
          fi
          checked_out_sha="$(git rev-parse HEAD)"
          remote_main_sha="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
          if [[ "$checked_out_sha" != "$TARGET_SHA" || "$remote_main_sha" != "$TARGET_SHA" ]]; then
            echo "Refusing to build a stale or mismatched commit" >&2
            exit 1
          fi
          echo "target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
      - name: Build static artifact from tracked files
        env:
          TARGET_SHA: ${{ steps.target.outputs.target_sha }}
        run: |
          set -euo pipefail
          mkdir _site
          git archive "$TARGET_SHA" | tar -x -C _site
          if find _site -type l -print -quit | grep -q .; then
            echo "Pages artifact must not contain symlinks" >&2
            exit 1
          fi
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site
          retention-days: 1

  deploy:
    name: Deploy fixed SHA
    needs: build
    if: github.event_name != 'workflow_call' || inputs.should_deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout fixed commit for final verification
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.build.outputs.target_sha }}
          fetch-depth: 1
      - name: Verify remote main immediately before deploy
        env:
          TARGET_SHA: ${{ needs.build.outputs.target_sha }}
        run: |
          set -euo pipefail
          remote_main_sha="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
          if [[ "$remote_main_sha" != "$TARGET_SHA" ]]; then
            echo "Refusing to deploy an artifact older than remote main" >&2
            exit 1
          fi
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
