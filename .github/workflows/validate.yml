name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Check generated project indexes
        run: python3 -m scripts.publish.index_generator --check
      - name: Check generated work records
        run: python3 scripts/dev/convert_work_records_to_html.py --check
      - name: Validate work record filenames
        run: python3 scripts/dev/validate_work_record_filenames.py
